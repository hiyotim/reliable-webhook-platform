[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
timezone = UTC
# The real URL comes from DATABASE_URL (see migrations/env.py); this default only
# keeps `alembic` usable when nothing is configured.
sqlalchemy.url = postgresql+asyncpg://webhooks:webhooks@localhost:5432/webhooks

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

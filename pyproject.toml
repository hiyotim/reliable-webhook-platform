[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reliable-webhook-platform"
version = "0.1.0"
description = "Reliable webhook delivery platform: FastAPI API + async workers, PostgreSQL-backed job coordination"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pgserver>=0.1.4",
]

[project.scripts]
webhooks-api = "webhooks.api.__main__:main"
webhooks-worker = "webhooks.worker.__main__:main"
webhooks-receiver = "webhooks.testing.receiver:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webhooks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic revisions are generated: keep them out of lint/format churn.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF", "S", "T20"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["webhooks", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "ASYNC109"]
"scripts/*" = ["T201", "S608", "ASYNC109"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["webhooks"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

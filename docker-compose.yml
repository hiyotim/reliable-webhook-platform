# Development / CI stack for the webhook platform.
#
#   docker compose up -d --build        # postgres, migrate, api, worker-1, worker-2
#   docker compose logs -f api
#   docker compose down --remove-orphans
#
# End-to-end verification adds the reference receiver and a one-shot verifier:
#   docker compose -f docker-compose.yml -f docker-compose.verify.yml run --rm verify
#
# There is intentionally no published port for PostgreSQL: reach the stack
# through the API instead, or use `make local-db` for a host-side database.

name: reliable-webhook-platform

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://webhooks:webhooks@postgres:5432/webhooks
  LOG_LEVEL: INFO
  LOG_FORMAT: json

# The platform already logs one JSON object per line, so the default json-file
# driver is the right one; bounding it keeps long-running stacks from filling
# the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # One-shot schema migration; everything else waits for it to exit 0.
  migrate:
    build: &app-build
      context: .
    image: reliable-webhook-platform:latest
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    build: *app-build
    image: reliable-webhook-platform:latest
    command: ["webhooks-api"]
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import os, urllib.request as u;
          u.urlopen('http://127.0.0.1:' + os.environ.get('API_PORT', '8000') + '/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Extra time for uvicorn to drain in-flight requests on `docker compose stop`.
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # Two workers with distinct WORKER_IDs: lease fencing (and therefore the
  # no-double-delivery guarantee) depends on every worker being identifiable.
  worker-1:
    build: *app-build
    image: reliable-webhook-platform:latest
    command: ["webhooks-worker"]
    environment:
      <<: *app-env
      WORKER_ID: worker-1
      DELIVERY_TIMEOUT_SECONDS: "10"
      WORKER_LEASE_SECONDS: "60"
      # Responsive claim discovery: with two workers polling every 250ms, a
      # backlog is always shared instead of drained by whichever worker woke first.
      WORKER_POLL_INTERVAL_SECONDS: "0.25"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Let in-flight deliveries finish before SIGKILL (timeout is 10s).
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  worker-2:
    build: *app-build
    image: reliable-webhook-platform:latest
    command: ["webhooks-worker"]
    environment:
      <<: *app-env
      WORKER_ID: worker-2
      DELIVERY_TIMEOUT_SECONDS: "10"
      WORKER_LEASE_SECONDS: "60"
      WORKER_POLL_INTERVAL_SECONDS: "0.25"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Let in-flight deliveries finish before SIGKILL (timeout is 10s).
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
